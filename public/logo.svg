<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" fill="none">
  <defs>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FCEFD2" />
      <stop offset="50%" stop-color="#E5C17D" />
      <stop offset="100%" stop-color="#9C7738" />
    </linearGradient>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#191B24" />
      <stop offset="100%" stop-color="#0A0B10" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="16" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>
  
  <!-- Outer Rounded Shield -->
  <rect width="512" height="512" rx="128" fill="url(#bgGrad)" stroke="#E5C17D" stroke-width="6" stroke-opacity="0.3" />
  
  <!-- Subtle Internal Grid / Glow -->
  <circle cx="256" cy="256" r="160" stroke="#E5C17D" stroke-width="1.5" stroke-dasharray="8 8" opacity="0.25" />
  <circle cx="256" cy="256" r="100" stroke="#E5C17D" stroke-width="1.5" opacity="0.2" />

  <!-- Stylized Open Wings / Symmetrical Pages of Knowledge -->
  <g filter="url(#glow)">
    <!-- Left Wing / Pages -->
    <path d="M 240 140 C 180 140 120 180 100 280 C 140 260 200 260 240 280 Z" fill="url(#goldGrad)" opacity="0.9" />
    <path d="M 240 200 C 190 200 150 230 130 320 C 170 305 210 305 240 320 Z" fill="url(#goldGrad)" opacity="0.75" />
    <path d="M 240 260 C 200 260 170 280 155 360 C 190 350 220 350 240 360 Z" fill="url(#goldGrad)" opacity="0.6" />

    <!-- Right Wing / Pages (Symmetric) -->
    <path d="M 272 140 C 332 140 392 180 412 280 C 372 260 312 260 272 280 Z" fill="url(#goldGrad)" opacity="0.9" />
    <path d="M 272 200 C 322 200 362 230 382 320 C 342 305 302 305 272 320 Z" fill="url(#goldGrad)" opacity="0.75" />
    <path d="M 272 260 C 312 260 342 280 357 360 C 322 350 292 350 272 360 Z" fill="url(#goldGrad)" opacity="0.6" />

    <!-- Central Neural Spine / Focus Diamond -->
    <path d="M 256 120 L 268 200 L 256 380 L 244 200 Z" fill="#FFFFFF" />
    <polygon points="256,90 270,115 256,140 242,115" fill="url(#goldGrad)" />
  </g>
</svg>
