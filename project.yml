name: MindSprint
options:
  bundleIdPrefix: com.AlexMohit
  deploymentTarget:
    iOS: "17.0"
  xcodeVersion: "16.0"
  generateEmptyDirectories: true

settings:
  base:
    PRODUCT_NAME: MindSprint
    PRODUCT_BUNDLE_IDENTIFIER: com.AlexMohit.MindSprint
    DEVELOPMENT_TEAM: "523MJL63MC"
    CODE_SIGN_STYLE: Automatic
    SWIFT_VERSION: "5.10"
    CURRENT_PROJECT_VERSION: "1"
    MARKETING_VERSION: "1.0.0"
    INFOPLIST_FILE: ios/App/Info.plist
    GENERATE_INFOPLIST_FILE: NO
    ENABLE_USER_SCRIPT_SANDBOXING: NO
    TARGETED_DEVICE_FAMILY: "1,2"
    SDKROOT: iphoneos

targets:
  MindSprint:
    type: application
    platform: iOS
    sources:
      - path: ios/App
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.AlexMohit.MindSprint
        PRODUCT_NAME: MindSprint
        INFOPLIST_FILE: ios/App/Info.plist
        TARGETED_DEVICE_FAMILY: "1,2"
