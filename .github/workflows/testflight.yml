name: MindSprint TestFlight Distribution

on:
  workflow_dispatch:
  push:
    branches: [ master, main ]
    tags:
      - 'v*'

jobs:
  deploy-testflight:
    runs-on: macos-15
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Select Xcode 16+
        run: sudo xcode-select -s /Applications/Xcode_16.2.app

      - name: Setup App Store Connect Auth
        env:
          APP_STORE_CONNECT_PRIVATE_KEY: ${{ secrets.APP_STORE_CONNECT_PRIVATE_KEY }}
        run: |
          mkdir -p ~/.appstoreconnect/private_keys
          echo "$APP_STORE_CONNECT_PRIVATE_KEY" > ~/.appstoreconnect/private_keys/AuthKey_38F6WA87DU.p8
          chmod 600 ~/.appstoreconnect/private_keys/AuthKey_38F6WA87DU.p8

      - name: Verify Preflight Gate
        run: |
          echo "Verifying App Store submission preflight invariants..."
          test -f ios/App/Info.plist || exit 1
          test -f app_store_metadata.json || exit 1
          echo "Preflight assertion passed."
