name: MindSprint PC-to-TestFlight Pipeline

on:
  push:
    branches: [ master, main ]
  workflow_dispatch:

concurrency:
  group: testflight-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-deliver:
    name: 🍏 Compile, Package & Deliver MindSprint to TestFlight
    runs-on: macos-15
    timeout-minutes: 30

    steps:
      - name: 📥 Checkout Repository
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: 🛠️ Select Xcode 16+ Environment
        run: |
          echo "Available Xcode installations:"
          ls -d /Applications/Xcode*.app
          sudo xcode-select -s /Applications/Xcode_16.2.app || sudo xcode-select -s /Applications/Xcode_16.app || sudo xcode-select -s /Applications/Xcode.app
          xcodebuild -version
          swift --version

      - name: ⚙️ Install XcodeGen
        run: brew install xcodegen

      - name: 🏗️ Generate Native Xcode Project with Dynamic Build Number
        run: |
          BUILD_NUM=$(( ${{ github.run_number }} + 100 ))
          echo "Setting CURRENT_PROJECT_VERSION to $BUILD_NUM"
          sed -i '' "s/CURRENT_PROJECT_VERSION: .*/CURRENT_PROJECT_VERSION: \"$BUILD_NUM\"/" project.yml
          xcodegen generate

      - name: 🔑 Configure App Store Connect API Credentials
        env:
          APP_STORE_CONNECT_PRIVATE_KEY: ${{ secrets.APP_STORE_CONNECT_PRIVATE_KEY }}
        run: |
          mkdir -p ~/.appstoreconnect/private_keys
          printf "%s\n" "$APP_STORE_CONNECT_PRIVATE_KEY" > ~/.appstoreconnect/private_keys/AuthKey_38F6WA87DU.p8
          chmod 600 ~/.appstoreconnect/private_keys/AuthKey_38F6WA87DU.p8
          echo "✓ App Store Connect API Key installed successfully."

      - name: 🧪 Validate Apple API Key Connection
        run: |
          xcrun altool --list-apps \
            --apiKey 38F6WA87DU \
            --apiIssuer 73c7355a-beef-4d79-919d-c3d7dec7747a

      - name: 🚀 Archive Release Candidate for TestFlight
        run: |
          mkdir -p build/archive build/output
          xcodebuild archive \
            -project MindSprint.xcodeproj \
            -scheme MindSprint \
            -destination 'generic/platform=iOS' \
            -sdk iphoneos \
            -configuration Release \
            -archivePath build/archive/MindSprint.xcarchive \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO

          echo "🔐 Embedding Archive Entitlements (Anti-Leap 7 assertion)..."
          cat > build/archive_entitlements.plist << 'EOF'
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
              <key>application-identifier</key>
              <string>523MJL63MC.com.AlexMohit.MindSprint</string>
              <key>com.apple.developer.team-identifier</key>
              <string>523MJL63MC</string>
          </dict>
          </plist>
          EOF

          codesign --force --sign - --entitlements build/archive_entitlements.plist build/archive/MindSprint.xcarchive/Products/Applications/MindSprint.app
          echo "🔎 Verifying Embedded Archive Entitlements:"
          codesign -d --entitlements :- build/archive/MindSprint.xcarchive/Products/Applications/MindSprint.app

      - name: 📤 Export & Deliver to TestFlight via Apple Direct Upload
        run: |
          xcodebuild -exportArchive \
            -archivePath build/archive/MindSprint.xcarchive \
            -exportOptionsPlist ExportOptions.plist \
            -exportPath build/output \
            -allowProvisioningUpdates \
            -authenticationKeyID 38F6WA87DU \
            -authenticationKeyIssuerID 73c7355a-beef-4d79-919d-c3d7dec7747a \
            -authenticationKeyPath ~/.appstoreconnect/private_keys/AuthKey_38F6WA87DU.p8
          echo "=========================================================="
          echo "🎉 MindSprint Build Successfully Delivered to Apple TestFlight!"
          echo "Target Bundle: com.AlexMohit.MindSprint"
          echo "=========================================================="

      - name: 📦 Archive MindSprint Signed TestFlight IPA Artifact
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: MindSprint-TestFlight-Build-${{ github.run_number }}
          path: build/output/
          retention-days: 14
