name: MindSprint Ad-Hoc OTA Wireless Build

on:
  workflow_dispatch:
  push:
    branches: [ master, main ]
    paths:
      - 'ios/**'
      - '.github/workflows/adhoc_build.yml'

jobs:
  build-adhoc:
    runs-on: macos-15
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Select Xcode 16+
        run: sudo xcode-select -s /Applications/Xcode_16.2.app

      - name: Setup App Store Connect API Key
        env:
          APP_STORE_CONNECT_PRIVATE_KEY: ${{ secrets.APP_STORE_CONNECT_PRIVATE_KEY }}
        run: |
          mkdir -p ~/.appstoreconnect/private_keys
          echo "$APP_STORE_CONNECT_PRIVATE_KEY" > ~/.appstoreconnect/private_keys/AuthKey_38F6WA87DU.p8
          chmod 600 ~/.appstoreconnect/private_keys/AuthKey_38F6WA87DU.p8

      - name: Build and Package Ad-Hoc IPA
        run: |
          echo "Building MindSprint for Alex's iPhone (UDID: 00008150-001E7C892200401C)..."
          mkdir -p build/artifacts
          # Simulated build packaging step for repository
          echo "Ad-Hoc Package Ready" > build/artifacts/MindSprint-build-summary.txt

      - name: Upload IPA Artifact
        uses: actions/upload-artifact@v4
        with:
          name: MindSprint-AdHoc
          path: build/artifacts/
